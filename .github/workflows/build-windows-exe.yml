name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Proofread App EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test and build tools
        run: python -m pip install --upgrade pip pytest pyinstaller

      - name: Run tests
        run: python -m pytest

      - name: Create PyInstaller launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          @'
          from proofread_app.ui import main

          if __name__ == "__main__":
              main()
          '@ | Set-Content -Encoding UTF8 build\pyinstaller_launcher.py

      - name: Build EXE
        run: >-
          python -m PyInstaller
          --clean
          --noconfirm
          --onefile
          --windowed
          --name "Proofread App"
          --paths src
          --distpath dist
          --workpath build\pyinstaller-work
          --specpath build
          build\pyinstaller_launcher.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\Proofread App.exe")) {
            throw "Expected EXE was not created: dist\Proofread App.exe"
          }
          Get-Item "dist\Proofread App.exe" | Format-List FullName, Length, LastWriteTime

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Proofread-App-Windows-EXE
          path: dist/Proofread App.exe
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Proofread App.exe
          generate_release_notes: true
