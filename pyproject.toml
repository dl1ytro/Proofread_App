[project]
name = "proofread-app"
version = "1.0.0"
description = "A lightweight Windows desktop proofreading UI."
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
proofread-app = "proofread_app.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
